[workspace]
resolver = "3"
members = ["crates/cli", "crates/core", "crates/web"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
