<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>history flow</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 id="title">history flow</h1>
      <label
        >color
        <select id="coloring">
          <option value="author">author</option>
          <option value="age">text age</option>
        </select>
      </label>
      <label
        >spacing
        <select id="spacing">
          <option value="version">version</option>
          <option value="date">date</option>
        </select>
      </label>
      <label
        >height
        <select id="height" title="What the plot's height stands for">
          <option value="all">longest version</option>
          <option value="view">longest in view</option>
        </select>
      </label>
      <label
        >scale
        <select id="scale" title="How a version's length is drawn">
          <option value="linear">linear</option>
          <option value="log">log</option>
        </select>
      </label>
      <label
        >compare
        <select id="mode">
          <option value="lines">lines</option>
          <option value="prose">words</option>
          <option value="sentences">sentences (2004)</option>
        </select>
      </label>
      <button id="stop" type="button" hidden>Stop</button>
      <button id="wikipedia" type="button">Wikipedia…</button>
      <button id="open" type="button">Open…</button>
      <button
        id="save"
        type="button"
        title="Save what is loaded as an archive file"
      >
        Save
      </button>
      <input
        id="file"
        type="file"
        accept=".hflow,.json,application/json"
        hidden
      />
    </header>
    <main>
      <aside>
        <h2>authors</h2>
        <ol id="authors"></ol>
      </aside>
      <div id="stage">
        <canvas id="plot"></canvas>
        <div id="scroll" hidden><div id="thumb"></div></div>
      </div>
      <section id="reader">
        <div id="version">
          <div id="version-nav">
            <button id="previous" type="button" title="Previous version (←)">
              ‹
            </button>
            <span id="version-number"></span>
            <button id="next" type="button" title="Next version (→)">›</button>
            <span id="version-id"></span>
          </div>
          <div id="version-who">
            <span class="swatch" id="version-swatch"></span>
            <span id="version-author"></span>
            <span id="version-date"></span>
          </div>
          <div id="version-comment"></div>
        </div>
        <div id="text-frame">
          <div id="text"></div>
          <div id="marker"></div>
        </div>
      </section>
    </main>
    <footer id="status"></footer>
    <dialog id="wiki">
      <form method="dialog">
        <h2>Wikipedia article history</h2>
        <label
          >Article title or address
          <input id="wiki-article" required placeholder="Chocolate" />
        </label>
        <label
          >Revisions to fetch, starting from the first
          <input id="wiki-limit" type="number" min="1" value="500" />
        </label>
        <p>
          Revisions arrive 50 at a time, with their full text, and are shown as
          they arrive. A long history takes a while and a lot of memory.
        </p>
        <menu>
          <button value="cancel" formnovalidate>Cancel</button>
          <button value="load">Fetch</button>
        </menu>
      </form>
    </dialog>
    <script src="build-info.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
