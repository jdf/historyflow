[package]
name = "historyflow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "historyflow"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
historyflow-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
tempfile = "3.27.0"
